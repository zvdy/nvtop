version: 2

builds:
  - main: ./cmd/nvtop
    env:
      - CGO_ENABLED=1
      - CGO_CFLAGS=-Wno-deprecated-declarations
    goos: [linux]
    goarch: [amd64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
